# ============================================================
# EHQ (Epistemic Honesty Quotient) Evaluation — Model Config
# 20-MODEL REFERENCE PANEL  (Scenario B: 8 generational pairs)
#
# Sources:
#   type: "asu"      → ASU CreateAI /query endpoint (FREE, courtesy affiliate)
#                      Token: env ASU_CREATEAI_TOKEN (Bearer)
#                      Base URL: https://api-main-poc.aiml.asu.edu  (verified)
#   type: "deepseek" → DeepSeek direct API (env DEEPSEEK_API_KEY)
#
# NO LOCAL MODELS (all via API — ASU serves small models too).
#
# ASU PAYLOAD REQUIREMENTS (verified 2026-07, service token):
#   MUST include: endpoint="query", request_source="override_params"
#   MUST include: enable_search=false, enable_history=false
#   MUST include: non-empty system_prompt (else gateway injects 800-3400
#                 token template contaminating evaluation)
#   WITHOUT override_params: gateway ignores model_name → defaults to
#                 project default (gpt4_1-mini for this project)
#
# REASONING NOTE: all frontier models use NON-thinking variants.
#   GPT-5.5      → key gpt5_5      (NOT gpt5_5_thinking)
#   DeepSeek-V4  → deepseek-v4-flash non-thinking
#   Reasoning models (o1/o3/o4, *_thinking) reserved for EHQ-2 paper.
#
# GENERATIONAL PAIRS (old → new), for RQ2:
#   "does epistemic honesty improve with capability or track accuracy?"
#
# VERIFIED: all 18 ASU models confirmed working (2026-07)
# ============================================================

experiment:
  name: "EHQ_Evaluation_20models"
  seed: 42
  deterministic: false
  output_dir: "outputs_ehq"
  verbose: true

max_workers: 4

models:

  # ══════════════════════════════════════════════════════════
  # PAIR 1 — Claude efficiency tier
  # ══════════════════════════════════════════════════════════
  - name: "Claude-3-Haiku"          # OLD
    type: "asu"
    params:
      model_name: "claude3_haiku"
      model_provider: "aws"
      api_key_env: "ASU_CREATEAI_TOKEN"
      base_url: "https://api-main-poc.aiml.asu.edu"
      endpoint: "query"
      request_source: "override_params"
      enable_search: false
      enable_history: false
      max_tokens: 512
      max_retries: 5
      timeout: 120
      temperature: 0.7
      request_delay: 1.0
      max_workers: 4

