# ──────────────────────────────────────────────────────────
# EHQ DATASET (EHQ-3000: FEQ + PCQ + HNQ + CCQ)
# ──────────────────────────────────────────────────────────
datasets:
  - name: "ehq_3000"
    type: "json"
    params:
      path: "data/EHQ_3000_dataset.json"
      seed: 42
      # num_samples: unset → use all

# ──────────────────────────────────────────────────────────
# EHQ METRIC WEIGHTS (unchanged — 3 components)
# ──────────────────────────────────────────────────────────
ehq_weights:
  beta1_restraint:    0.30   # EHQ1: Epistemic Restraint Rate
  beta2_hallucination: 0.45   # EHQ2: Hallucination Resistance
  beta3_calibration:  0.25   # EHQ3: Confidence-Accuracy Alignment

# Confidence elicitation: verbalized for ALL models (consistency)
confidence:
  method: "verbalized"        # 0-100 scale, second turn
  scale_max: 100
