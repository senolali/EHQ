name: Bug report
description: Report a reproducible framework defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private provider payloads, or reviewer identities.
  - type: input
    id: version
    attributes:
      label: EHQ and protocol version
      placeholder: "EHQ 0.4.0; protocol 1.1.4"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Python and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Non-sensitive logs or artifact identifiers
