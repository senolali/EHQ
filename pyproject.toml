[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehq"
version = "0.4.0"
description = "Reproducible evaluation framework for the Epistemic Honesty Quotient and EHQ-3000"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Ali Şenol", email = "alisenol@tarsus.edu.tr"},
  {name = "H. Russell Bernard"},
  {name = "Huan Liu"},
]
maintainers = [
  {name = "Ali Şenol", email = "alisenol@tarsus.edu.tr"},
]
keywords = [
  "large-language-models",
  "hallucination",
  "abstention",
  "calibration",
  "benchmark",
  "evaluation",
  "epistemic-honesty",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "requests>=2.31,<3",
  "truststore>=0.10,<1; sys_platform == 'win32'",
]

[project.optional-dependencies]
analysis = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
]
sources = [
  "lxml>=5,<7",
  "pdfplumber>=0.11,<1",
]
reporting = [
  "openpyxl>=3.1,<4",
  "matplotlib>=3.7,<4",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "twine>=5,<7",
]
all = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "lxml>=5,<7",
  "pdfplumber>=0.11,<1",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.7,<4",
]

[project.urls]
Homepage = "https://github.com/senolali/EHQ"
Documentation = "https://github.com/senolali/EHQ#readme"
Repository = "https://github.com/senolali/EHQ.git"
Issues = "https://github.com/senolali/EHQ/issues"
Changelog = "https://github.com/senolali/EHQ/blob/main/CHANGELOG.md"
Dataset = "https://raw.githubusercontent.com/senolali/EHQ/main/data/releases/EHQ-3000.json"

[project.scripts]
ehq = "ehq.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ehq = [
  "py.typed",
  "resources/project/.env.example",
  "resources/project/config/*.json",
  "resources/project/config/*.csv",
  "resources/project/data/examples/*.json",
  "resources/project/data/releases/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["ehq"]

[tool.coverage.report]
show_missing = true
skip_covered = true
